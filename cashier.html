<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>الكاشير</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F4F1EC;--card:#fff;--ink:#2A2018;--muted:#8a7d6f;
    --primary:#6F4E37;--btn:#6F4E37;--on-primary:#fff;--on-btn:#fff;--line:#e7e0d6;--ok:#2f7d4f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100dvh}
  .wrap{max-width:1500px;margin:0 auto;padding:18px 20px 40px}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .head h1{font-size:19px;margin:0;font-weight:800}
  .head .out{font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;font-family:inherit}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;
    box-shadow:0 8px 24px -18px rgba(0,0,0,.3)}
  label{display:block;font-size:13.5px;font-weight:700;margin:14px 0 6px;color:var(--muted)}
  input,select{width:100%;font-family:inherit;font-size:16px;padding:13px 14px;
    border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--primary);border-color:transparent}
  .btn{appearance:none;border:0;border-radius:12px;padding:15px;width:100%;
    font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;background:var(--btn);
    color:var(--on-btn);margin-top:18px;transition:.15s;box-shadow:0 9px 22px color-mix(in srgb,var(--btn) 20%,transparent)}
  .btn:active{transform:scale(.99)} .btn:disabled{opacity:.5}
  .btn.alt{background:#25D366;color:#10251a} /* واتساب */
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid color-mix(in srgb,var(--primary) 45%,var(--line));box-shadow:none}
  .cups-input{display:flex;gap:8px;align-items:center}
  .cups-input button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);
    background:#fff;font-size:24px;font-weight:800;cursor:pointer;color:var(--primary)}
  .cups-input input{text-align:center;font-size:22px;font-weight:800}
  .result{margin-top:16px;padding:16px;border-radius:14px;background:#f0f6f1;
    border:1px solid #cfe6d6;display:none}
  .result.show{display:block}
  .result .big{font-size:17px;font-weight:800;color:var(--ok)}
  .result .sub{font-size:14px;color:var(--muted);margin-top:6px}
  .found{font-size:14px;color:var(--ok);font-weight:700;margin-top:8px;min-height:20px}
  .phone-row{display:grid;grid-template-columns:1fr 92px;gap:9px;align-items:end}
  .phone-row .btn{margin:0;height:50px;padding:10px}
  .new-customer{display:none;margin-top:14px;padding:14px;border-radius:14px;
    background:#fffaf1;border:1px solid #ead9b8}
  .new-customer.show,.transaction.show{display:block}
  .new-customer label{margin-top:0}
  .new-customer .btn{margin-top:10px}
  .transaction{display:none;animation:fadeIn .22s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .reward-chip{display:inline-flex;align-items:center;gap:8px;background:#fff5e6;
    border:1px solid #f0d9a8;border-radius:12px;padding:10px 14px;margin-top:10px;
    font-size:14px;font-weight:700;width:100%;justify-content:space-between}
  .reward-chip button{background:var(--primary);color:var(--on-primary);border:0;border-radius:8px;
    padding:8px 12px;font-family:inherit;font-weight:700;cursor:pointer}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(140%);
    background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;
    transition:.3s;z-index:99}.toast.show{transform:translateX(-50%) translateY(0)}.toast.err{background:#8c2f2f}
  .login{max-width:360px;margin:60px auto 0}
  .workspace{display:grid;grid-template-columns:minmax(340px,1fr) minmax(0,1fr);gap:18px;align-items:start}.work-column{min-width:0}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 10px}.panel-title h2{font-size:17px;margin:0}.panel-title p{font-size:12px;color:var(--muted);margin:2px 0 0}.tab{border:1px solid var(--line);background:#fff;color:var(--primary);border-radius:13px;padding:10px 13px;font:800 13px inherit;cursor:pointer}.loyalty-panel{min-width:0}.orders-panel{display:block;min-width:0}.orders-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.orders-grid{display:grid;grid-template-columns:1fr;gap:12px;max-height:calc(100dvh - 112px);overflow:auto;padding:2px 3px 80px}.order-card{padding:16px}.order-card.arrived{border:2px solid var(--ok);box-shadow:0 0 0 4px #2f7d4f18;animation:arrivalPulse 1.2s ease-in-out 3}@keyframes arrivalPulse{50%{box-shadow:0 0 0 9px #2f7d4f24}}.order-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.order-num{font-size:13px;color:var(--muted)}.status{border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800;background:#f3eee8}.plate{font-family:system-ui,sans-serif;font-size:25px;letter-spacing:.13em;font-weight:900;text-align:center;border:2px solid #222;border-radius:10px;padding:8px;margin:12px 0;direction:ltr;background:#fff;color:#111}.customer-line{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.arrival-note{background:#e9f7f0;color:#176b49;border-radius:11px;padding:9px;margin:10px 0;font-weight:800}.items{margin:10px 0;border-top:1px solid var(--line)}.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.order-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.order-actions .btn{margin:0;padding:10px;font-size:13px}.order-actions .primary-action{grid-column:1/-1;font-size:15px;padding:13px}.empty-orders{text-align:center;color:var(--muted);padding:40px}.live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-size:13px}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px #2f7d4f20}
  .qr-modal{position:fixed;inset:0;z-index:120;display:none;place-items:center;padding:20px;background:#0009;backdrop-filter:blur(6px)}.qr-modal.show{display:grid}.qr-card{width:min(390px,100%);background:#fff;color:#211915;border-radius:22px;padding:20px;text-align:center}.qr-card img{display:block;width:280px;max-width:100%;aspect-ratio:1;margin:14px auto;border-radius:14px}.qr-card h2{margin:0}.qr-card p{color:#766b63;line-height:1.7}.qr-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qr-actions .btn{margin:0}.qr-actions .ghost{color:var(--primary)}
  @media(max-width:900px){.workspace{grid-template-columns:1fr}.orders-grid{max-height:none}.wrap{padding-inline:12px}.orders-panel{order:-1}}
</style>
</head>
<body>
<div class="wrap">
  <!-- تسجيل الدخول -->
  <div id="loginView" class="login" style="display:none">
    <div class="card">
      <h1 style="margin:0 0 4px">دخول الموظف</h1>
      <p style="color:var(--muted);font-size:14px;margin:0">سجّل بالبريد ورمز المرور</p>
      <label>البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="username" />
      <label>رمز المرور</label>
      <input id="pass" type="password" autocomplete="current-password" />
      <button class="btn" id="loginBtn">تسجيل الدخول</button>
      <a href="./reset-password.html" style="display:block;text-align:center;margin-top:14px;color:var(--primary)">نسيت كلمة المرور؟</a>
    </div>
  </div>

  <!-- شاشة العمل -->
  <div id="workView" style="display:none">
    <div class="head">
      <h1>نظام الكاشير</h1>
      <button class="out" id="logoutBtn">خروج</button>
    </div>
    <div class="workspace">
    <section id="loyaltyPanel" class="loyalty-panel work-column"><div class="panel-title"><div><h2>الولاء وتسجيل الزيارة</h2><p>رقم العميل ثم اعتماد العملية</p></div></div><div class="card">
      <label>رقم جوال العميل</label>
      <div class="phone-row">
        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="05xxxxxxxx" />
        <button class="btn" id="lookupBtn" type="button">إضافة</button>
      </div>
      <div class="found" id="found"></div>

      <div class="new-customer" id="newCustomerBox">
        <label>عميل جديد — الاسم اختياري</label>
        <input id="cname" type="text" autocomplete="name" placeholder="اسم العميل (يمكن تركه فارغًا)" />
        <button class="btn ghost" id="continueNewBtn" type="button">متابعة</button>
      </div>

      <div class="transaction" id="transactionBox">
        <label>عدد الأكواب</label>
        <div class="cups-input">
          <button id="minus" type="button">−</button>
          <input id="cups" type="number" value="1" min="1" max="100" />
          <button id="plus" type="button">+</button>
        </div>

        <label>ملاحظة (اختياري)</label>
        <input id="note" type="text" placeholder="" />

        <button class="btn" id="submitBtn">إضافة العملية وفتح واتساب</button>
        <button class="btn ghost" id="qrBtn" type="button">▦ عرض باركود صفحة العميل</button>
      </div>

      <div class="result" id="result"></div>

      <button class="btn alt" id="waBtn" style="display:none">
        📲 إرسال رابط العميل عبر واتساب</button>

      <div id="rewardBox"></div>
    </div></section>
    <section id="ordersPanel" class="orders-panel work-column">
      <div class="orders-head panel-title"><div><h2>طلبات السيارة</h2><div class="live">تحديث مباشر</div></div><button class="tab" id="refreshOrders">تحديث</button></div>
      <div class="orders-grid" id="ordersGrid"><div class="card empty-orders">جاري تحميل الطلبات…</div></div>
    </section>
    </div>
  </div>
</div>

<div class="qr-modal" id="qrModal" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
  <div class="qr-card">
    <h2 id="qrTitle">باركود صفحة العميل</h2>
    <p>وجّه العميل لمسح الرمز؛ سيفتح رابط صفحته المكوّن من 8 خانات مباشرة.</p>
    <img id="qrImage" alt="باركود صفحة العميل">
    <div class="qr-actions"><button class="btn ghost" id="closeQr" type="button">إغلاق</button><button class="btn" id="copyCustomerLink" type="button">نسخ الرابط</button></div>
  </div>
</div>

<script type="module">
import { sb, callFn, toast, applyBrand, escapeHTML } from "./app.js";

const $ = s => document.querySelector(s);
let cafeId = null, cafeName = "الكافيه", currentCustomer = null, orderChannel = null, knownOrders = new Map(), orderPoll = null, audioCtx = null, lastNoticeAt = 0;

function rgb(value){let h=String(value||"").replace("#","");if(h.length===3)h=h.split("").map(x=>x+x).join("");const n=parseInt(h,16);return Number.isFinite(n)?[(n>>16)&255,(n>>8)&255,n&255]:[111,78,55]}
function luminance(value){const [r,g,b]=rgb(value).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b}
const contrast=(a,b)=>(Math.max(luminance(a),luminance(b))+.05)/(Math.min(luminance(a),luminance(b))+.05);
const onColor=value=>contrast(value,"#fff")>=contrast(value,"#18201f")?"#fff":"#18201f";

// جلسة
const { data: sess } = await sb.auth.getSession();
if (sess?.session) initWork(); else showLogin();

function showLogin(){ $("#loginView").style.display="block"; $("#workView").style.display="none"; }

$("#loginBtn").onclick = async () => {
  const email=$("#email").value.trim(), password=$("#pass").value;
  if(!email||!password) return toast("أدخل البريد ورمز المرور", true);
  $("#loginBtn").disabled=true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $("#loginBtn").disabled=false;
  if(error) return toast("بيانات الدخول غير صحيحة", true);
  initWork();
};
$("#logoutBtn").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function initWork(){
  $("#loginView").style.display="none"; $("#workView").style.display="block";
  // الكافيه المرتبط بالموظف
  const { data: u } = await sb.auth.getUser();
  const { data: staff } = await sb.from("staff")
    .select("cafe_id").eq("user_id", u.user.id).eq("is_active",true).limit(1).maybeSingle();
  if(!staff){ toast("حسابك غير مرتبط بكافيه", true); return; }
  cafeId = staff.cafe_id;
  // هوية الكافيه (الألوان) — تطبّق على واجهة الكاشير
  const { data: cafe } = await sb.from("cafes")
    .select("name,color_primary,color_secondary,color_button").eq("id",cafeId).maybeSingle();
  applyBrand(cafe);
  cafeName=cafe?.name||"الكافيه";
  document.documentElement.style.setProperty("--on-btn",onColor(cafe?.color_button||cafe?.color_primary||"#6F4E37"));
  document.documentElement.style.setProperty("--on-primary",onColor(cafe?.color_primary||"#6F4E37"));
  await loadOrders();
  subscribeOrders();
  clearInterval(orderPoll);orderPoll=setInterval(loadOrders,10000);
}

document.addEventListener("pointerdown",ensureAudio,{once:true});
$("#refreshOrders").onclick=loadOrders;

function resetCustomer(){
  currentCustomer=null;
  $("#found").textContent="";
  $("#newCustomerBox").classList.remove("show");
  $("#transactionBox").classList.remove("show");
  $("#waBtn").style.display="none";
  $("#result").classList.remove("show");
  $("#rewardBox").innerHTML="";
}
$("#phone").oninput=resetCustomer;

function showTransaction(customer){
  currentCustomer=customer;
  $("#newCustomerBox").classList.remove("show");
  $("#transactionBox").classList.add("show");
  $("#found").textContent=`✓ ${customer.full_name||"العميل جاهز"}`;
  renderRewards(customer.rewards||[]);
}

async function prepareCustomer(fullName=null){
  const phone=$("#phone").value.trim();
  const digits=phone.replace(/\D/g,"");
  if(digits.length<9) throw new Error("INVALID_PHONE");
  return callFn("customer-upsert",{
    cafe_id:cafeId,phone,full_name:fullName||null,
    client_base_url:new URL(".",location.href).href
  },true);
}

$("#lookupBtn").onclick=async()=>{
  const btn=$("#lookupBtn"); btn.disabled=true; btn.textContent="…";
  resetCustomer();
  try{
    const customer=await prepareCustomer();
    if(customer.is_new){
      currentCustomer=customer;
      $("#found").textContent="الرقم غير مسجّل — أضف الاسم إن رغبت";
      $("#newCustomerBox").classList.add("show");
      $("#cname").focus();
    }else showTransaction(customer);
  }catch(e){
    toast(e.message==="INVALID_PHONE"?"أدخل رقم جوال صحيح":"تعذّر البحث عن العميل",true);
  }finally{btn.disabled=false;btn.textContent="إضافة";}
};

$("#continueNewBtn").onclick=async()=>{
  const btn=$("#continueNewBtn");btn.disabled=true;btn.textContent="جارٍ التجهيز…";
  try{ showTransaction(await prepareCustomer($("#cname").value.trim()||null)); }
  catch(e){ toast("تعذّر تجهيز العميل",true); }
  finally{btn.disabled=false;btn.textContent="متابعة";}
};

// عداد الأكواب
$("#minus").onclick=()=>{const c=$("#cups");c.value=Math.max(1,(+c.value||1)-1);};
$("#plus").onclick =()=>{const c=$("#cups");c.value=Math.min(100,(+c.value||1)+1);};

$("#waBtn").onclick=()=>{
  const link=$("#waBtn").dataset.link;
  if(link) window.open(link,"_blank","noopener");
};

$("#qrBtn").onclick=async()=>{
  const link=currentCustomer?.client_link;
  if(!link)return toast("جهّز العميل أولًا",true);
  const button=$("#qrBtn");button.disabled=true;button.textContent="جارٍ تجهيز الباركود…";
  try{
    const QR=await import("https://esm.sh/qrcode@1.5.4?bundle");
    $("#qrImage").src=await QR.toDataURL(link,{width:320,margin:2,errorCorrectionLevel:"M",color:{dark:"#17120f",light:"#ffffff"}});
    $("#copyCustomerLink").dataset.link=link;
    $("#qrModal").classList.add("show");
  }catch{toast("تعذر تجهيز الباركود",true)}
  finally{button.disabled=false;button.textContent="▦ عرض باركود صفحة العميل"}
};
$("#closeQr").onclick=()=>$("#qrModal").classList.remove("show");
$("#qrModal").onclick=e=>{if(e.target===$("#qrModal"))$("#qrModal").classList.remove("show")};
$("#copyCustomerLink").onclick=async()=>{const link=$("#copyCustomerLink").dataset.link;if(!link)return;try{await navigator.clipboard.writeText(link);toast("تم نسخ رابط العميل")}catch{toast("تعذر نسخ الرابط",true)}};

// اعتماد العملية
$("#submitBtn").onclick = async () => {
  const phone=$("#phone").value.trim();
  if(phone.replace(/\D/g,"").length < 9) return toast("أدخل رقم جوال صحيح", true);
  if(!currentCustomer?.customer_id) return toast("اضغط إضافة لتجهيز العميل أولًا",true);
  const cups=Math.min(100,Math.max(1,+$("#cups").value||1));
  // الرابط جُهّز مسبقًا عند إضافة الرقم، لذلك يفتح واتساب مباشرة بلا صفحة انتظار وسيطة.
  const waLink=currentCustomer.wa_web_link||currentCustomer.wa_link||"";
  const whatsappWindow=waLink?window.open("about:blank","_blank"):null;
  if(whatsappWindow)whatsappWindow.opener=null;
  $("#submitBtn").disabled=true;
  try{
    // العميل جُهّز مسبقًا؛ هنا نسجّل الزيارة فقط.
    const res = await sb.rpc("add_visit",{
      p_customer: currentCustomer.customer_id, p_cups: cups,
      p_branch: null, p_note: $("#note").value.trim()||null });
    if(res.error) throw res.error;
    if(whatsappWindow)whatsappWindow.location.replace(waLink);
    const d = res.data;

    const box=$("#result");
    box.innerHTML = `<div class="big">تمت إضافة ${cups} ${cups==1?"كوب":"أكواب"} ✓</div>
      <div class="sub">الرصيد الحالي: ${d.balance} من ${d.cups_per_reward}</div>
      ${d.free_cups_earned>0?`<div class="sub">🎉 استحق ${d.free_cups_earned} كوب مجاني!</div>`:""}
      <div class="sub">العميل مؤهل للعب الروليت من صفحته</div>`;
    box.classList.add("show");

    // زر احتياطي لإعادة فتح واتساب إذا أغلقه الموظف.
    const waBtn=$("#waBtn");
    waBtn.dataset.link = waLink;
    waBtn.style.display = "block";
    waBtn.textContent = "📲 فتح واتساب مرة أخرى";
    if(!waLink) waBtn.style.display="none";
    if(waLink&&!whatsappWindow) toast("المتصفح منع فتح واتساب — اضغط زر واتساب",true);

    toast("تم الاعتماد");
    loadRewards(currentCustomer.customer_id);
    $("#found").textContent = `✓ ${currentCustomer.full_name||"العميل"}`;
    $("#note").value="";
  }catch(e){
    whatsappWindow?.close();
    const m = String(e.message||e);
    toast(m.includes("DAILY_LIMIT")?"تجاوز الحد اليومي":"تعذّر الاعتماد", true);
  }finally{ $("#submitBtn").disabled=false; }
};

// عرض قائمة مكافآت (تُستدعى من البحث أو بعد الاعتماد)
function renderRewards(rewards){
  const box=$("#rewardBox"); box.innerHTML="";
  (rewards||[]).forEach(r=>{
    const d=document.createElement("div"); d.className="reward-chip";
    const label=document.createElement("span");
    label.textContent=`🎁 ${r.label||"مكافأة"}`;
    const use=document.createElement("button"); use.type="button"; use.textContent="استخدام";
    d.append(label,use);
    use.onclick=async()=>{
      try{ const res=await sb.rpc("redeem_reward",{p_reward:r.id});
        if(res.error) throw res.error;
        if(res.data?.status==="expired") toast("انتهت صلاحية المكافأة",true);
        else toast("تم استخدام المكافأة");
        d.remove(); }
      catch(e){ toast("تعذّر الاستخدام", true); }
    };
    box.appendChild(d);
  });
}

// جلب المكافآت من القاعدة ثم عرضها (بعد اعتماد العملية)
async function loadRewards(customerId){
  try{
    const customer=await callFn("customer-upsert",{
      cafe_id:cafeId,phone:$("#phone").value.trim(),search_only:true
    },true);
    renderRewards(customer.found?customer.rewards:[]);
  }catch{ renderRewards([]); }
}

const statusLabel={pending:"طلب جديد",accepted:"قيد التحضير",preparing:"قيد التحضير",ready:"جاهز",completed:"مكتمل",cancelled:"ملغي",no_show:"لم يحضر"};
function ensureAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)()}catch{}}
function notifyOrder(kind="new"){const now=Date.now();if(now-lastNoticeAt<900)return;lastNoticeAt=now;navigator.vibrate?.(kind==="arrival"?[260,80,260,80,360]:[180,70,220,70,280]);if(!audioCtx)return;audioCtx.resume?.().catch(()=>{});const notes=kind==="arrival"?[880,1040,880,1180]:[660,820,980];notes.forEach((frequency,index)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),start=audioCtx.currentTime+index*.16;o.type="square";o.frequency.setValueAtTime(frequency,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.17,start+.025);g.gain.exponentialRampToValueAtTime(.0001,start+.14);o.connect(g);g.connect(audioCtx.destination);o.start(start);o.stop(start+.16)})}
function subscribeOrders(){
  if(orderChannel) sb.removeChannel(orderChannel);
  orderChannel=sb.channel(`car-orders-${cafeId}`).on("postgres_changes",{
    event:"*",schema:"public",table:"orders",filter:`cafe_id=eq.${cafeId}`
  },payload=>{const before=knownOrders.get(payload.new?.id);if(payload.eventType==="INSERT")notifyOrder("new");else if(!before?.arrived_at&&payload.new?.arrived_at)notifyOrder("arrival");loadOrders();}).subscribe();
}
async function loadOrders(){
  if(!cafeId)return;
  const {data:orders,error}=await sb.from("orders").select(`
    id,order_number,status,payment_status,subtotal,discount_total,total,vehicle_plate,vehicle_color,
    vehicle_model,parking_spot,note,arrived_at,created_at,updated_at,
    customers(full_name,phone,public_code),
    order_items(id,product_name,quantity,line_total,reward_applied,order_item_options(option_name,price_delta))
  `).eq("cafe_id",cafeId).in("status",["pending","accepted","preparing","ready"])
    .order("arrived_at",{ascending:false,nullsFirst:false}).order("created_at",{ascending:true});
  if(error){$("#ordersGrid").innerHTML='<div class="card empty-orders">تعذر تحميل الطلبات.</div>';return}
  knownOrders=new Map((orders||[]).map(order=>[order.id,order]));renderOrders(orders||[]);
}
function renderOrders(orders){
  const grid=$("#ordersGrid");
  if(!orders.length){grid.innerHTML='<div class="card empty-orders" style="grid-column:1/-1">لا توجد طلبات قائمة الآن.</div>';return}
  grid.innerHTML=orders.map(orderCard).join("");
  grid.querySelectorAll("[data-order-action]").forEach(button=>button.onclick=()=>updateOrder(button.dataset.order,button.dataset.orderAction,button));
}
function orderCard(o){
  const customer=Array.isArray(o.customers)?o.customers[0]:o.customers;
  const actions=o.status==="pending"?[["preparing","بدء التحضير"],["cancelled","إلغاء"]]
    :o.status==="accepted"?[["ready","جاهز"],["cancelled","إلغاء"]]
    :o.status==="preparing"?[["ready","جاهز"],["cancelled","إلغاء"]]
    :[["complete","تسليم وتحصيل"],["no_show","لم يحضر"]];
  return `<article class="card order-card ${o.arrived_at?"arrived":""}"><div class="order-top"><div><b>طلب #${o.order_number}</b><div class="order-num">${new Date(o.created_at).toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"})}</div></div><span class="status">${statusLabel[o.status]}</span></div><div class="plate">${escapeHTML(o.vehicle_plate)}</div><div class="customer-line"><span>${escapeHTML(customer?.full_name||"عميل")}</span><span dir="ltr">${escapeHTML(customer?.phone||"")}</span></div><div class="customer-line"><span>${escapeHTML(o.vehicle_color||"")} ${escapeHTML(o.vehicle_model||"")}</span><b>${Number(o.total||0).toFixed(2)} ر.س</b></div>${o.arrived_at?`<div class="arrival-note">🚗 العميل وصل${o.parking_spot?` — ${escapeHTML(o.parking_spot)}`:""}</div>`:""}${o.note?`<div class="arrival-note" style="background:#fff8e8;color:#755516">ملاحظة: ${escapeHTML(o.note)}</div>`:""}<div class="items">${(o.order_items||[]).map(i=>`<div class="item"><span>${i.quantity} × ${escapeHTML(i.product_name)}${i.reward_applied?" 🎁":""}<small class="muted">${(i.order_item_options||[]).map(x=>escapeHTML(x.option_name)).join("، ")}</small></span><b>${Number(i.line_total).toFixed(2)}</b></div>`).join("")}</div><div class="order-actions">${actions.map(([action,label])=>`<button class="btn ${action==="cancelled"||action==="no_show"?"ghost":"primary-action"}" data-order="${o.id}" data-order-action="${action}">${label}</button>`).join("")}</div></article>`;
}
function customerWhatsAppLink(order){const customer=Array.isArray(order?.customers)?order.customers[0]:order?.customers;if(!customer?.phone||!customer?.public_code)return"";let phone=String(customer.phone).replace(/\D/g,"");if(phone.startsWith("0"))phone="966"+phone.slice(1);const customerLink=new URL(`./index.html#${customer.public_code}`,location.href).href;const greeting=customer.full_name?`أهلًا ${customer.full_name} 👋`:"أهلًا وسهلًا 👋";const message=[greeting,`شكرًا لزيارتك ${cafeName} ☕`,`تم تسليم طلبك وتسجيل زيارتك في برنامج الولاء.\nتابع أكوابك ومكافآتك من هنا:\n${customerLink}`,"نتمنى لك يومًا جميلًا 🤎"].join("\n\n");return `https://web.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(message)}`}
async function updateOrder(orderId,action,button){
  if((action==="cancelled"||action==="no_show")&&!confirm("تأكيد هذا الإجراء؟"))return;
  const waLink=action==="complete"?customerWhatsAppLink(knownOrders.get(orderId)):"";
  const whatsappWindow=waLink?window.open("about:blank","_blank"):null;
  if(whatsappWindow)whatsappWindow.opener=null;
  button.disabled=true;
  try{
    const {data,error}=action==="complete"
      ?await sb.rpc("complete_car_order",{p_order:orderId})
      :await sb.rpc("staff_update_car_order",{p_order:orderId,p_status:action});
    if(error)throw error;
    if(whatsappWindow)whatsappWindow.location.replace(waLink);
    if(action==="complete"&&waLink&&!whatsappWindow)toast("تم التسليم — المتصفح منع فتح واتساب",true);
    else toast(action==="complete"?"تم التسليم وتسجيل الولاء وفتح واتساب":"تم تحديث الطلب");await loadOrders();
  }catch(e){whatsappWindow?.close();toast("تعذر تحديث الطلب",true);button.disabled=false;}
}
</script>
