<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6F4E37">
  <title>استعادة كلمة المرور</title>
  <style>
    @font-face{font-family:foda;src:url("./foda.ttf") format("truetype");font-display:swap}
    :root{--primary:#6F4E37;--secondary:#C8A97E;--bg:#f7f2ec;--ink:#2d211b;--muted:#74675f;--line:#dfd4ca;--err:#a23535}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      background:radial-gradient(circle at top,#fff 0,var(--bg) 65%);color:var(--ink);font-family:foda,system-ui,sans-serif}
    .card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;
      box-shadow:0 22px 60px rgba(66,43,30,.12)}
    .mark{width:54px;height:54px;display:grid;place-items:center;border-radius:18px;background:var(--primary);color:#fff;font-size:26px}
    h1{font-size:25px;margin:18px 0 6px} p{color:var(--muted);line-height:1.7;margin:0 0 20px}
    label{display:block;font-size:14px;margin:14px 0 7px} input{width:100%;padding:13px 14px;border:1px solid var(--line);
      border-radius:13px;font:inherit;direction:ltr;text-align:left;background:#fff;color:var(--ink)}
    input:focus{outline:2px solid color-mix(in srgb,var(--secondary) 55%,transparent);border-color:var(--secondary)}
    button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:13px;background:var(--primary);color:#fff;
      font:700 16px foda,system-ui;cursor:pointer} button:disabled{opacity:.55;cursor:wait}
    .message{min-height:24px;margin:14px 0 0;font-size:14px}.message.err{color:var(--err)}
    .back{display:block;text-align:center;margin-top:18px;color:var(--primary);text-decoration:none}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">☕</div>

    <section id="requestView">
      <h1>استعادة كلمة المرور</h1>
      <p>أدخل بريد حساب الكافيه وسنرسل لك رابطًا آمنًا لتعيين كلمة مرور جديدة.</p>
      <form id="requestForm">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="email" required>
        <button id="requestBtn" type="submit">إرسال رابط الاستعادة</button>
      </form>
      <p class="message" id="requestMessage" aria-live="polite"></p>
    </section>

    <section id="updateView" hidden>
      <h1>اختر كلمة مرور جديدة</h1>
      <p>استخدم عشرة أحرف على الأقل، ويفضل الجمع بين الحروف والأرقام والرموز.</p>
      <form id="updateForm">
        <label for="password">كلمة المرور الجديدة</label>
        <input id="password" type="password" minlength="10" autocomplete="new-password" required>
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required>
        <button id="updateBtn" type="submit">حفظ كلمة المرور</button>
      </form>
      <p class="message" id="updateMessage" aria-live="polite"></p>
    </section>

    <a class="back" href="./dashboard.html">العودة إلى تسجيل الدخول</a>
  </main>

<script type="module">
import { sb } from "./app.js";

const $=selector=>document.querySelector(selector);
const recoveryHint=location.hash.includes("access_token=") ||
  new URLSearchParams(location.search).has("code");

function showUpdate(){
  $("#requestView").hidden=true;
  $("#updateView").hidden=false;
  history.replaceState(null,"",location.pathname);
}

const hashError=new URLSearchParams(location.hash.slice(1)).get("error_description");
if(hashError){
  $("#requestMessage").textContent="رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا.";
  $("#requestMessage").classList.add("err");
  history.replaceState(null,"",location.pathname);
}

sb.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY" || (recoveryHint && session)) showUpdate();
});

const {data:{session}}=await sb.auth.getSession();
if(recoveryHint && session) showUpdate();

$("#requestForm").onsubmit=async event=>{
  event.preventDefault();
  const button=$("#requestBtn"), message=$("#requestMessage");
  button.disabled=true; message.classList.remove("err"); message.textContent="جارٍ إرسال الرابط…";
  const redirectTo=new URL("reset-password.html",location.href).href;
  const {error}=await sb.auth.resetPasswordForEmail($("#email").value.trim(),{redirectTo});
  button.disabled=false;
  if(error){
    message.textContent="تعذّر إرسال الرابط الآن. تأكد من البريد وحاول لاحقًا.";
    message.classList.add("err");
    return;
  }
  message.textContent="تم الإرسال. افتح أحدث رسالة في بريدك، وقد تصل إلى الرسائل غير المرغوبة.";
};

$("#updateForm").onsubmit=async event=>{
  event.preventDefault();
  const password=$("#password").value, confirmation=$("#confirmPassword").value;
  const button=$("#updateBtn"), message=$("#updateMessage");
  message.classList.remove("err");
  if(password.length<10){ message.textContent="استخدم عشرة أحرف على الأقل."; message.classList.add("err"); return; }
  if(password!==confirmation){ message.textContent="كلمتا المرور غير متطابقتين."; message.classList.add("err"); return; }
  button.disabled=true; message.textContent="جارٍ حفظ كلمة المرور…";
  const {error}=await sb.auth.updateUser({password});
  if(error){
    button.disabled=false;
    message.textContent="تعذّر الحفظ أو انتهت جلسة الاستعادة. اطلب رابطًا جديدًا.";
    message.classList.add("err");
    return;
  }
  await sb.auth.signOut({scope:"global"});
  message.textContent="تم تغيير كلمة المرور. سيتم نقلك لتسجيل الدخول…";
  setTimeout(()=>location.replace("./dashboard.html"),1200);
};
</script>
</body>
</html>
