<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#241812">
  <title>اطلب من سيارتك</title>
  <style>
    @font-face{font-family:Foda;src:url("./foda.ttf") format("truetype");font-display:swap}
    :root{--primary:#6f4e37;--secondary:#c8a97e;--bg:#f5f1ec;--btn:#6f4e37;--ink:#241812;--pageInk:#241812;--muted:#746b65;--card:#fff;--line:#e7ddd3;--onPrimary:#fff;--onBtn:#fff;--ok:#16835e;--danger:#b63838}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Foda,Tajawal,system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--primary) 12%,transparent),transparent 34rem),radial-gradient(circle at 0 38%,color-mix(in srgb,var(--secondary) 10%,transparent),transparent 28rem)}
    button,input,select,textarea{font:inherit}.shell{max-width:820px;margin:auto;padding:20px 16px 110px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--pageInk)}.logo{width:56px;height:56px;border-radius:19px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-size:26px;box-shadow:0 8px 28px color-mix(in srgb,var(--primary) 12%,transparent)}.logo img{width:100%;height:100%;object-fit:cover}.title{flex:1;min-width:0}.title h1{font-size:22px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title p{margin:3px 0 0;opacity:.72;font-size:14px}.link{color:var(--pageInk);font-weight:900;text-decoration:none;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:13px;padding:9px 12px;white-space:nowrap}
    .card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 16px 44px color-mix(in srgb,var(--primary) 9%,transparent);margin-bottom:14px}.hero{background:linear-gradient(140deg,var(--primary),color-mix(in srgb,var(--primary) 72%,#000));color:var(--onPrimary);border:0;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;inset:auto -70px -100px auto;background:color-mix(in srgb,var(--secondary) 22%,transparent)}.hero p,.hero h2,.hero .plate{position:relative;z-index:1}.hero p{opacity:.84}.hero h2{font-size:27px;margin:4px 0}.btn{border:1px solid color-mix(in srgb,var(--onBtn) 18%,transparent);border-radius:16px;padding:13px 17px;background:var(--btn);color:var(--onBtn);font-weight:900;cursor:pointer;min-height:48px;box-shadow:0 10px 24px color-mix(in srgb,var(--btn) 24%,transparent)}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.btn.alt{background:color-mix(in srgb,var(--primary) 10%,var(--card));color:var(--ink);border:1px solid color-mix(in srgb,var(--primary) 25%,var(--line));box-shadow:none}.btn.danger{background:#fff1f1;color:var(--danger);border:1px solid #efc5c5;box-shadow:none}.wide{width:100%}
    .field{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff;color:#211915;outline:none}.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}label{display:block;font-weight:800;margin:13px 2px 7px}.hint,.muted{color:var(--muted);font-size:14px}.otp{font-size:27px;letter-spacing:.45em;text-align:center;direction:ltr}.phone-entry{font:900 24px system-ui,sans-serif;text-align:center;direction:ltr;letter-spacing:.04em}.login-points{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.login-point{background:color-mix(in srgb,var(--primary) 6%,var(--card));border:1px solid var(--line);border-radius:14px;padding:11px 7px;text-align:center;font-size:12px;font-weight:800}.welcome{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}.welcome strong{display:block;font-size:18px}.welcome small{color:var(--muted)}
    .cats{display:flex;gap:8px;overflow:auto;padding:7px 2px 13px;scrollbar-width:none;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);z-index:4}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:900;cursor:pointer;box-shadow:0 6px 18px color-mix(in srgb,var(--primary) 7%,transparent)}.chip.active{background:var(--primary);color:var(--onPrimary);border-color:var(--primary)}.chip.rewards-nav{background:var(--btn);color:var(--onBtn);border-color:transparent}.chip .count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--onBtn);color:var(--btn);margin-inline-start:5px;font-size:12px}.section-title{font-size:20px;margin:22px 2px 10px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{padding:0;overflow:hidden;display:grid;grid-template-columns:118px 1fr;min-height:144px;border-radius:18px;box-shadow:0 9px 26px color-mix(in srgb,var(--primary) 7%,transparent);transition:transform .18s,box-shadow .18s}.product:active{transform:scale(.99)}.product-img{height:100%;min-height:144px;background:color-mix(in srgb,var(--secondary) 18%,var(--card));display:grid;place-items:center;font-size:38px;border-inline-end:1px solid var(--line)}.product-img img{width:100%;height:100%;object-fit:cover}.product-body{padding:15px;display:flex;min-width:0;flex-direction:column}.product h3{font-size:18px;margin:0 0 4px}.product p{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{font-weight:900;margin-top:auto}.add{min-width:76px;height:40px;border:1px solid color-mix(in srgb,var(--onBtn) 18%,transparent);border-radius:11px;background:var(--btn);color:var(--onBtn);font-size:14px;font-weight:900;cursor:pointer;box-shadow:none}.product-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
    .cartbar{position:fixed;z-index:20;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(788px,calc(100% - 24px));background:var(--btn);color:var(--onBtn);border:1px solid color-mix(in srgb,var(--onBtn) 20%,transparent);border-radius:18px;padding:13px 16px;display:none;align-items:center;gap:12px;box-shadow:0 14px 44px color-mix(in srgb,var(--btn) 45%,transparent);font-weight:900;cursor:pointer;text-align:right}.cartbar.show{display:flex}.cartbar-main{flex:1}.cartbar-main strong,.cartbar-main small{display:block}.cartbar-main small{opacity:.78;font-size:12px;margin-top:2px}.cartbar-total{font-size:18px}.badge{background:var(--onBtn);color:var(--btn);width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
    .overlay{position:fixed;inset:0;background:#120b08b8;z-index:30;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)}.overlay.show{display:flex}.sheet{background:var(--bg);color:var(--ink);width:min(820px,100%);max-height:94vh;overflow:auto;border-radius:30px 30px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -24px 70px #0003}.sheet-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-18px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);padding:12px 0;z-index:5}.sheet-head h2{margin:0}.close{border:1px solid var(--line);background:var(--card);color:var(--ink);width:42px;height:42px;border-radius:14px;font-size:22px}.option{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--card)}.option span{flex:1}.review-block{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin:12px 0}.review-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.review-title h3{margin:0;font-size:17px}.review-kicker{color:var(--muted);font-size:12px;margin:0}.cartline{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}.cartline:last-child{border-bottom:0}.cartline-title{font-size:16px}.cartline-price{color:var(--muted);font-size:13px;margin-top:4px}.qty{display:flex;align-items:center;gap:9px;background:color-mix(in srgb,var(--primary) 5%,var(--card));border:1px solid var(--line);border-radius:12px;padding:4px}.qty button{width:34px;height:34px;border:0;background:var(--card);color:var(--ink);border-radius:9px;font-size:18px}.plate-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.plate-field{background:color-mix(in srgb,var(--primary) 5%,var(--card));border:1px solid var(--line);border-radius:16px;padding:11px}.plate-field label{margin:0 0 7px}.plate-field .field{font:900 24px system-ui,sans-serif;text-align:center;letter-spacing:.12em;text-transform:uppercase}.summary{background:color-mix(in srgb,var(--primary) 7%,var(--card));border:1px solid color-mix(in srgb,var(--primary) 14%,var(--line));border-radius:16px;padding:13px;margin:14px 0}.sumrow{display:flex;justify-content:space-between;margin:7px 0}.sumrow.total{font-size:20px;font-weight:900;border-top:1px solid var(--line);padding-top:10px}.reward-list{display:grid;gap:10px}.reward-item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}.reward-item b{display:block}.reward-item small{display:block;color:var(--muted);margin-top:3px}.reward-item .btn{min-height:40px;padding:9px 12px;border-radius:11px}.reward-products{display:grid;grid-template-columns:1fr 1fr;gap:9px}.reward-product{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px;text-align:right;cursor:pointer}.reward-product b,.reward-product small{display:block}.reward-product small{color:var(--muted);margin-top:4px}.checkout-footer{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(12px);padding:12px 0 calc(22px + env(safe-area-inset-bottom));z-index:4}
    .status{display:flex;justify-content:space-between;gap:4px;margin:20px 0}.step{flex:1;text-align:center;font-size:11px;color:var(--muted);position:relative}.step:before{content:"";display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 7px;background:var(--line);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}.step.done:before,.step.now:before{background:var(--ok);box-shadow:0 0 0 1px var(--ok)}.step.now{color:var(--ok);font-weight:900}.plate{font-family:system-ui,sans-serif;letter-spacing:.16em;font-size:29px;font-weight:900;background:#fff;color:#111;border:3px solid #222;border-radius:10px;padding:9px 15px;text-align:center;direction:ltr}.order-items{margin:12px 0}.order-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}.arrival{background:#edf9f4;border:1px solid #bde8d6;padding:14px;border-radius:17px;color:#0b6a49;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.empty{text-align:center;padding:30px;color:var(--muted)}
    @media(max-width:620px){.products{grid-template-columns:1fr}.product{grid-template-columns:108px 1fr;min-height:132px}.product-img{min-height:132px}.product-body{padding:12px}.shell{padding-inline:12px}.status{gap:0}.step{font-size:10px}.plate-inputs{grid-template-columns:1fr 1fr}.link{font-size:13px;padding:8px 10px}.login-points{grid-template-columns:1fr}.login-point{padding:9px}.reward-products{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell" id="app"><div class="card empty">جاري تحميل قائمة الطلب…</div></main>
  <button class="cartbar" id="cartBar"><span class="badge" id="cartCount">0</span><span class="cartbar-main"><strong>عرض السلة</strong><small id="cartLabel">0 منتجات</small></span><span class="cartbar-total" id="cartTotal">0 ر.س</span><span aria-hidden="true">‹</span></button>
  <div class="overlay" id="productModal"><div class="sheet" id="productSheet"></div></div>
  <div class="overlay" id="cartModal"><div class="sheet" id="cartSheet"></div></div>
  <script type="module">
    import { callFn, applyTheme, escapeHTML, safeHttpUrl, toast } from "./app.js";
    const $=s=>document.querySelector(s);
    const raw=decodeURIComponent(location.hash.slice(1)).trim();
    const code=/^[A-HJ-NP-Z2-9]{8}$/i.test(raw)?raw.toUpperCase():new URLSearchParams(raw).get("c")?.toUpperCase();
    const sessionKey=`cafe-order-session:${code||"invalid"}`;
    let session=localStorage.getItem(sessionKey)||"", data=null, cart=new Map(), selectedCategory="all", pollTimer=null;
    const checkoutDraft={reward:"",rewardProduct:"",plateLetters:"",plateNumbers:"",color:"",model:"",note:""};
    const money=n=>`${Number(n||0).toFixed(2).replace(/\.00$/,"")} ر.س`;
    const api=(action,extra={})=>callFn("order-api",{action,cafe_code:code,customer_session:session,...extra});
    const logo=c=>safeHttpUrl(c?.logo_url)?`<img src="${escapeHTML(safeHttpUrl(c.logo_url))}" alt="">`:"☕";
    function rgb(value){let h=String(value||"").replace("#","");if(h.length===3)h=h.split("").map(x=>x+x).join("");const n=parseInt(h,16);return Number.isFinite(n)?[(n>>16)&255,(n>>8)&255,n&255]:[245,241,236]}
    function luminance(value){const [r,g,b]=rgb(value).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b}
    const contrast=(a,b)=>(Math.max(luminance(a),luminance(b))+.05)/(Math.min(luminance(a),luminance(b))+.05);
    const onColor=value=>contrast(value,"#ffffff")>=contrast(value,"#18201f")?"#ffffff":"#18201f";
    const mix=(a,b,t)=>"#"+rgb(a).map((v,i)=>Math.round(v+(rgb(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
    function theme(c){applyTheme(c);const root=document.documentElement.style,bg=c.color_background||"#f5f1ec",primary=c.color_primary||"#6f4e37",button=c.color_button||primary,pageInk=onColor(bg),card=luminance(bg)>.5?mix(bg,"#000000",.055):mix(bg,"#ffffff",.84),ink=onColor(card);root.setProperty("--pageInk",pageInk);root.setProperty("--card",card);root.setProperty("--ink",ink);root.setProperty("--muted",mix(ink,card,.38));root.setProperty("--line",mix(card,ink,.16));root.setProperty("--onPrimary",onColor(primary));root.setProperty("--onBtn",onColor(button));document.querySelector('meta[name="theme-color"]').content=bg}
    function header(c,sub="اطلب من سيارتك") {const customerCode=data?.customer?.public_code;return `<header class="top"><div class="logo">${logo(c)}</div><div class="title"><h1>${escapeHTML(c.name||"الكافيه")}</h1><p>${escapeHTML(sub)}</p></div>${customerCode?`<a class="link" href="./index.html#${customerCode}">بطاقتي</a>`:""}</header>`}
    async function load(){
      if(!code){$("#app").innerHTML='<div class="card empty">الرابط غير صالح.</div>';return}
      try{data=await api("bootstrap");theme(data.cafe||{});render()}
      catch(e){$("#app").innerHTML=`<div class="card empty">تعذر تحميل الطلب.<br><small>${escapeHTML(e.message)}</small></div>`}
    }
    function render(){
      if(!data.cafe?.car_ordering_enabled){$("#app").innerHTML=header(data.cafe)+`<div class="card empty">الطلب من السيارة غير متاح حاليًا.</div>`;return}
      if(!data.authenticated){renderLogin();return}
      if(data.active_order){renderOrder(data.active_order);startPolling(data.active_order.id);return}
      stopPolling();renderMenu();
    }
    function renderLogin(){
      $("#app").innerHTML=header(data.cafe,"الطلب والمكافآت")+`<section class="card hero"><p>باركود واحد لكل عملاء المحل</p><h2>اطلب من سيارتك واستعرض مكافآتك</h2><p>أدخل جوالك، وسيصلك رمز تحقق عبر واتساب لفتح حسابك بأمان.</p></section><section class="card" id="loginBox"><h2>رقم الجوال</h2><p class="muted">اكتب الرقم المستخدم في برنامج الولاء. إذا كنت جديدًا سننشئ لك بطاقة تلقائيًا.</p><label for="phone">رقم الجوال</label><input class="field phone-entry" id="phone" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="05xxxxxxxx"><div class="login-points"><div class="login-point">🎁 مكافآتك جاهزة</div><div class="login-point">🚗 طلب من السيارة</div><div class="login-point">💵 الدفع عند الاستلام</div></div><button class="btn wide" id="sendOtp">متابعة عبر واتساب</button><p class="hint" id="loginMsg" aria-live="polite"></p></section>`;
      $("#sendOtp").onclick=requestOtp;
      $("#phone").onkeydown=e=>{if(e.key==="Enter")requestOtp()};
    }
    async function requestOtp(){const b=$("#sendOtp"),m=$("#loginMsg"),phone=$("#phone")?.value.trim();if(!/^(?:\+?966|0)?5\d{8}$/.test((phone||"").replace(/[\s-]/g,""))){m.textContent="أدخل رقم جوال سعودي صحيح.";return}b.disabled=true;m.textContent="جارٍ إرسال الرمز…";try{const r=await callFn("customer-auth",{action:"request",cafe_code:code,phone});m.textContent=`أرسلنا الرمز إلى ${r.masked_phone}`;$("#loginBox").innerHTML=`<h2>رمز التحقق</h2><p class="muted">أرسلنا 6 أرقام عبر واتساب إلى ${escapeHTML(r.masked_phone)}</p><input class="field otp" id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="btn wide" id="verifyOtp">فتح حسابي</button><button class="btn alt wide" style="margin-top:8px" id="resendOtp">إرسال رمز جديد</button><p class="hint" id="loginMsg" aria-live="polite"></p>`;$("#verifyOtp").onclick=()=>verifyOtp(r.challenge_id);$("#resendOtp").onclick=()=>{renderLogin();$("#phone").value=phone;$("#phone").focus()};$("#otp").onkeydown=e=>{if(e.key==="Enter")verifyOtp(r.challenge_id)};$("#otp").focus()}catch(e){m.textContent=message(e.message);b.disabled=false}}
    async function verifyOtp(challenge){const v=$("#otp").value.replace(/\D/g,""),m=$("#loginMsg"),b=$("#verifyOtp");if(v.length!==6){m.textContent="أدخل 6 أرقام.";return}b.disabled=true;m.textContent="جارٍ التحقق…";try{const r=await callFn("customer-auth",{action:"verify",cafe_code:code,challenge_id:challenge,code:v});session=r.customer_session;localStorage.setItem(sessionKey,session);await load()}catch(e){m.textContent=message(e.message);b.disabled=false}}
    function message(code){return ({INVALID_PHONE:"أدخل رقم جوال صحيح.",CAFE_NOT_FOUND:"رابط المحل غير صالح أو الطلب متوقف.",WHATSAPP_NOT_CONFIGURED:"خدمة واتساب تحتاج إكمال الإعداد من التاجر.",WHATSAPP_SEND_FAILED:"تعذر إرسال الرسالة الآن. حاول بعد قليل.",WAIT_BEFORE_RESEND:"انتظر دقيقة قبل إعادة الإرسال.",TOO_MANY_REQUESTS:"تم تجاوز عدد المحاولات. حاول لاحقًا.",OTP_INVALID:"الرمز غير صحيح.",OTP_EXPIRED:"انتهت صلاحية الرمز. اطلب رمزًا جديدًا.",OTP_LOCKED:"محاولات كثيرة. اطلب رمزًا جديدًا لاحقًا.",LOGIN_REQUIRED:"يرجى تسجيل الدخول أولًا.",ACTIVE_ORDER_EXISTS:"لديك طلب قائم بالفعل.",MIN_TOTAL_NOT_MET:"قيمة الطلب أقل من الحد الأدنى.",PRODUCT_UNAVAILABLE:"أحد المنتجات لم يعد متاحًا.",INVALID_PLATE:"أدخل 3 حروف للوحة، ومن رقمين إلى 4 أرقام."})[code]||"تعذر إكمال العملية. حاول مرة أخرى."}
    function renderMenu(){
      const cats=data.categories||[],products=data.products||[];
      const filtered=selectedCategory==="all"?products:products.filter(p=>p.category_id===selectedCategory);
      const customerName=data.customer?.full_name||"عميلنا";
      $("#app").innerHTML=header(data.cafe)+`<section class="card welcome"><div><small>أهلًا ${escapeHTML(customerName)}</small><strong>${(data.rewards||[]).length?`لديك ${(data.rewards||[]).length} مكافأة جاهزة 🎁`:"اختر طلبك من القائمة"}</strong></div><button class="btn alt" id="rewardsTop">عرض المكافآت</button></section><section class="card hero"><p>استلم طلبك من السيارة</p><h2>اختر طلبك، وبلّغنا عند وصولك</h2><p>الدفع عند الاستلام • ويمكنك طلب المكافأة وحدها</p></section><nav class="cats" aria-label="أقسام القائمة"><button class="chip rewards-nav" id="rewardsNav">🎁 مكافآتي <span class="count">${(data.rewards||[]).length}</span></button><button class="chip ${selectedCategory==="all"?"active":""}" data-cat="all">الكل</button>${cats.map(c=>`<button class="chip ${selectedCategory===c.id?"active":""}" data-cat="${c.id}">${escapeHTML(c.name)}</button>`).join("")}</nav><h2 class="section-title">المنتجات</h2><section class="products">${filtered.map(productCard).join("")||'<div class="card empty" style="grid-column:1/-1">لا توجد منتجات متاحة حاليًا.</div>'}</section>`;
      document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.cat;renderMenu()});
      document.querySelectorAll("[data-product]").forEach(b=>b.onclick=()=>openProduct(b.dataset.product));$("#rewardsNav").onclick=openRewards;$("#rewardsTop").onclick=openRewards;updateCartBar();
    }
    function productCard(p){const img=safeHttpUrl(p.image_url);return `<article class="card product"><div class="product-img">${img?`<img src="${escapeHTML(img)}" alt="${escapeHTML(p.name)}">`:"☕"}</div><div class="product-body"><h3>${escapeHTML(p.name)}</h3><p>${escapeHTML(p.description||"منتج يُحضّر لك عند الطلب")}</p><div class="product-foot"><span class="price">${money(p.base_price)}</span><button class="add" data-product="${p.id}" aria-label="إضافة ${escapeHTML(p.name)}">إضافة</button></div></div></article>`}
    function openProduct(id){const p=data.products.find(x=>x.id===id),opts=data.options.filter(o=>o.product_id===id);$("#productSheet").innerHTML=`<div class="sheet-head"><h2>${escapeHTML(p.name)}</h2><button class="close" data-close>×</button></div><p class="muted">${escapeHTML(p.description||"")}</p>${[...new Set(opts.map(o=>o.group_name))].map(group=>`<h3>${escapeHTML(group)}</h3>${opts.filter(o=>o.group_name===group).map(o=>`<label class="option"><input type="${o.is_multiple?"checkbox":"radio"}" name="group-${escapeHTML(group)}" value="${o.id}"><span>${escapeHTML(o.name)}</span><b>${o.price_delta?`+ ${money(o.price_delta)}`:"مجانًا"}</b></label>`).join("")}`).join("")}<button class="btn wide" id="addProduct">إضافة إلى السلة • ${money(p.base_price)}</button>`;show("#productModal",true);$("#productSheet [data-close]").onclick=()=>show("#productModal",false);$("#addProduct").onclick=()=>{const optionIds=[...$("#productSheet").querySelectorAll("input:checked")].map(i=>i.value).sort(),key=`${id}:${optionIds.join(",")}`,old=cart.get(key);cart.set(key,{key,product:p,optionIds,quantity:(old?.quantity||0)+1});show("#productModal",false);updateCartBar()}}
    function openRewards(){const rewards=data.rewards||[];$("#productSheet").innerHTML=`<div class="sheet-head"><div><p class="review-kicker">رصيدك الحالي</p><h2>مكافآتي</h2></div><button class="close" data-close>×</button></div><div class="reward-list">${rewards.length?rewards.map(r=>`<div class="reward-item"><div><b>🎁 ${escapeHTML(r.label||"مكافأة")}</b><small>تقدر تطلبها وحدها بدون إضافة منتج آخر</small></div><button class="btn" data-use-reward="${r.id}">اطلبها</button></div>`).join(""):'<div class="card empty">لا توجد مكافآت جاهزة الآن.<br><small>كل طلب مكتمل يقرّبك من مكافأتك التالية.</small></div>'}</div>`;show("#productModal",true);$("#productSheet [data-close]").onclick=()=>show("#productModal",false);document.querySelectorAll("[data-use-reward]").forEach(b=>b.onclick=()=>chooseRewardProduct(b.dataset.useReward))}
    function chooseRewardProduct(rewardId){$("#productSheet").innerHTML=`<div class="sheet-head"><div><p class="review-kicker">اختر منتج المكافأة</p><h2>ماذا تريد؟</h2></div><button class="close" data-close>×</button></div><p class="muted">المكافأة تغطي السعر الأساسي لمنتج واحد. الإضافات — إن وجدت — تُحسب بشكل منفصل.</p><div class="reward-products">${(data.products||[]).map(p=>`<button class="reward-product" data-reward-product="${p.id}"><b>${escapeHTML(p.name)}</b><small>${money(p.base_price)} ← مجانًا بالمكافأة</small></button>`).join("")}</div>`;$("#productSheet [data-close]").onclick=openRewards;document.querySelectorAll("[data-reward-product]").forEach(b=>b.onclick=()=>startRewardOrder(rewardId,b.dataset.rewardProduct))}
    function startRewardOrder(rewardId,productId){const p=data.products.find(x=>x.id===productId);if(!p)return;const key=`${p.id}:`,old=cart.get(key);cart.set(key,{key,product:p,optionIds:[],quantity:(old?.quantity||0)+1});checkoutDraft.reward=rewardId;checkoutDraft.rewardProduct=p.id;show("#productModal",false);updateCartBar();openCart()}
    function show(sel,on){$(sel).classList.toggle("show",on)}
    function totals(){let subtotal=0;for(const line of cart.values()){const extras=line.optionIds.reduce((s,id)=>s+Number(data.options.find(o=>o.id===id)?.price_delta||0),0);subtotal+=(Number(line.product.base_price)+extras)*line.quantity}return subtotal}
    function rewardDiscount(){if(!checkoutDraft.reward||!checkoutDraft.rewardProduct)return 0;const line=[...cart.values()].find(l=>l.product.id===checkoutDraft.rewardProduct);return line?Math.min(Number(line.product.base_price||0),totals()):0}
    function finalTotal(){return Math.max(totals()-rewardDiscount(),0)}
    function updateCartBar(){const count=[...cart.values()].reduce((s,l)=>s+l.quantity,0);$("#cartCount").textContent=count;$("#cartLabel").textContent=`${count} ${count===1?"منتج":"منتجات"}`;$("#cartTotal").textContent=money(finalTotal());$("#cartBar").classList.toggle("show",count>0)}
    $("#cartBar").onclick=openCart;
    function openCart(){if(!cart.size)return;renderCartSheet();show("#cartModal",true)}
    function renderCartSheet(){const rewards=data.rewards||[],lines=[...cart.values()],uniqueProducts=[...new Map(lines.map(l=>[l.product.id,l.product])).values()];if(checkoutDraft.rewardProduct&&!uniqueProducts.some(p=>p.id===checkoutDraft.rewardProduct)){checkoutDraft.reward="";checkoutDraft.rewardProduct=""}const discount=rewardDiscount();$("#cartSheet").innerHTML=`<div class="sheet-head"><div><p class="review-kicker">${lines.reduce((s,l)=>s+l.quantity,0)} منتجات</p><h2>السلة ومراجعة الطلب</h2></div><button class="close" data-close>×</button></div><section class="review-block"><div class="review-title"><h3>المنتجات</h3><b>${money(totals())}</b></div>${lines.map(l=>{const opts=l.optionIds.map(id=>data.options.find(o=>o.id===id)?.name).filter(Boolean),unit=Number(l.product.base_price)+l.optionIds.reduce((s,id)=>s+Number(data.options.find(o=>o.id===id)?.price_delta||0),0);return `<div class="cartline"><div><b class="cartline-title">${escapeHTML(l.product.name)}</b><div class="cartline-price">${opts.length?`${escapeHTML(opts.join("، "))} • `:""}${money(unit)} للواحد</div></div><div class="qty"><button data-minus="${escapeHTML(l.key)}" aria-label="تقليل">−</button><b>${l.quantity}</b><button data-plus="${escapeHTML(l.key)}" aria-label="زيادة">＋</button></div></div>`}).join("")}</section>${rewards.length?`<section class="review-block"><div class="review-title"><h3>استخدام مكافأة</h3><span class="review-kicker">اختياري</span></div><label for="reward">المكافأة</label><select class="field" id="reward"><option value="">بدون مكافأة</option>${rewards.map(r=>`<option value="${r.id}">${escapeHTML(r.label)}</option>`).join("")}</select><label for="rewardProduct">تُطبّق على</label><select class="field" id="rewardProduct" disabled><option value="">اختر المنتج</option>${uniqueProducts.map(p=>`<option value="${p.id}">${escapeHTML(p.name)}</option>`).join("")}</select><p class="hint">يمكن إرسال طلب يحتوي على المكافأة وحدها، وتبقى الإضافات مدفوعة.</p></section>`:""}<section class="review-block"><div class="review-title"><h3>بيانات السيارة</h3><span class="review-kicker">مطلوبة للتسليم</span></div><label>رقم اللوحة *</label><div class="plate-inputs"><div class="plate-field"><label for="plateLetters">الحروف — 3</label><input class="field" id="plateLetters" maxlength="3" inputmode="text" autocomplete="off" placeholder="أ ب ج" aria-label="حروف اللوحة"></div><div class="plate-field"><label for="plateNumbers">الأرقام — 2 إلى 4</label><input class="field" id="plateNumbers" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="1234" aria-label="أرقام اللوحة" dir="ltr"></div></div><label for="color">لون السيارة *</label><input class="field" id="color" maxlength="40" placeholder="مثال: أبيض"><label for="model">نوع / موديل السيارة</label><input class="field" id="model" maxlength="80" placeholder="مثال: كامري"><label for="note">ملاحظة للطلب</label><textarea class="field" id="note" maxlength="500" rows="2" placeholder="مثال: بدون سكر، المدخل الجانبي…"></textarea></section><div class="checkout-footer"><div class="summary"><div class="sumrow"><span>المجموع</span><span>${money(totals())}</span></div>${discount?`<div class="sumrow"><span>خصم المكافأة</span><b>− ${money(discount)}</b></div>`:""}<div class="sumrow"><span>الدفع</span><b>عند الاستلام</b></div><div class="sumrow total"><span>الإجمالي</span><span>${money(finalTotal())}</span></div></div><button class="btn wide" id="submitOrder">إرسال الطلب للكاشير</button><p class="hint" id="orderMsg" aria-live="polite"></p></div>`;
      $("#cartSheet [data-close]").onclick=()=>show("#cartModal",false);document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>changeQty(b.dataset.plus,1));document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>changeQty(b.dataset.minus,-1));for(const id of Object.keys(checkoutDraft)){const el=$("#"+id);if(el)el.value=checkoutDraft[id]}const reward=$("#reward"),rewardProduct=$("#rewardProduct"),letters=$("#plateLetters"),numbers=$("#plateNumbers");if(reward){rewardProduct.disabled=!reward.value;reward.onchange=()=>{if(!reward.value)rewardProduct.value="";rememberCheckout();rewardProduct.disabled=!reward.value;renderCartSheet()};rewardProduct.onchange=()=>{rememberCheckout();renderCartSheet()}}if(letters)letters.oninput=()=>{letters.value=letters.value.replace(/[^A-Za-z\u0621-\u064A]/g,"").slice(0,3).toUpperCase();rememberCheckout()};if(numbers)numbers.oninput=()=>{numbers.value=numbers.value.replace(/\D/g,"").slice(0,4);rememberCheckout()};[$("#color"),$("#model"),$("#note")].filter(Boolean).forEach(el=>el.oninput=rememberCheckout);$("#submitOrder").onclick=submitOrder;
    }
    function rememberCheckout(){for(const id of Object.keys(checkoutDraft)){const el=$("#"+id);if(el)checkoutDraft[id]=el.value}}
    function changeQty(key,delta){rememberCheckout();const l=cart.get(key);if(!l)return;l.quantity+=delta;if(l.quantity<1)cart.delete(key);if(checkoutDraft.rewardProduct&&![...cart.values()].some(x=>x.product.id===checkoutDraft.rewardProduct)){checkoutDraft.reward="";checkoutDraft.rewardProduct=""}updateCartBar();if(cart.size)renderCartSheet();else show("#cartModal",false)}
    async function submitOrder(){rememberCheckout();const b=$("#submitOrder"),m=$("#orderMsg"),letters=checkoutDraft.plateLetters.trim().toUpperCase(),numbers=checkoutDraft.plateNumbers.replace(/\D/g,""),plate=`${letters} ${numbers}`,color=checkoutDraft.color.trim(),reward=checkoutDraft.reward,rewardProduct=checkoutDraft.rewardProduct;if(!/^[A-Z\u0621-\u064A]{3}$/.test(letters)||!/^\d{2,4}$/.test(numbers)){m.textContent="أدخل 3 حروف للوحة، ومن رقمين إلى 4 أرقام.";return}if(color.length<2){m.textContent="أدخل لون السيارة.";return}if(reward&&!rewardProduct){m.textContent="اختر المنتج الذي ستطبق عليه المكافأة.";return}b.disabled=true;m.textContent="جارٍ إرسال الطلب…";try{const r=await api("create",{vehicle_plate:plate,vehicle_color:color,vehicle_model:checkoutDraft.model,note:checkoutDraft.note,reward_id:reward||null,reward_product_id:rewardProduct||null,items:[...cart.values()].map(l=>({product_id:l.product.id,quantity:l.quantity,option_ids:l.optionIds}))});data.active_order=r.order;cart.clear();Object.keys(checkoutDraft).forEach(k=>checkoutDraft[k]="");updateCartBar();show("#cartModal",false);renderOrder(r.order);startPolling(r.order.id);navigator.vibrate?.([70,40,120])}catch(e){m.textContent=message(e.message);b.disabled=false}}
    const statusLabels={pending:"طلب جديد",accepted:"قيد التحضير",preparing:"قيد التحضير",ready:"جاهز للاستلام",completed:"تم التسليم",cancelled:"ملغي",no_show:"لم يحضر"};
    function renderOrder(o){const stages=["pending","preparing","ready"],visualStatus=o.status==="accepted"?"preparing":o.status,idx=stages.indexOf(visualStatus),active=["pending","accepted","preparing","ready"].includes(o.status);$("#app").innerHTML=header(data.cafe,"متابعة الطلب")+`<section class="card hero"><p>طلب رقم #${o.order_number}</p><h2>${escapeHTML(statusLabels[o.status]||o.status)}</h2><div class="plate">${escapeHTML(o.vehicle_plate)}</div></section><section class="card"><div class="status">${stages.map((s,i)=>`<div class="step ${i<idx?"done":i===idx?"now":""}">${statusLabels[s]}</div>`).join("")}</div>${o.arrived_at?'<div class="arrival">✓ تم إبلاغ الكاشير بوصولك</div>':active?`<label>رقم الموقف أو وصف مكانك</label><input class="field" id="spot" maxlength="50" placeholder="مثال: موقف 4 أمام الباب"><button class="btn wide" style="margin-top:9px" id="arrive">أنا وصلت للمحل</button>`:""}<div class="order-items">${(o.order_items||[]).map(i=>`<div class="order-row"><span>${i.quantity} × ${escapeHTML(i.product_name)}${i.reward_applied?' 🎁':''}</span><b>${money(i.line_total)}</b></div>`).join("")}</div><div class="summary"><div class="sumrow"><span>المجموع</span><span>${money(o.subtotal)}</span></div>${Number(o.discount_total)>0?`<div class="sumrow"><span>المكافأة</span><span>− ${money(o.discount_total)}</span></div>`:""}<div class="sumrow total"><span>المطلوب عند الاستلام</span><span>${money(o.total)}</span></div></div>${o.status==="pending"?'<button class="btn danger wide" id="cancelOrder">إلغاء الطلب</button>':""}${!active?`<a class="btn alt wide" style="display:block;text-align:center;text-decoration:none;margin-top:9px" href="./order.html#${code}">طلب جديد</a>`:""}<p class="hint" id="stateMsg"></p></section>`;$("#cartBar").classList.remove("show");if($("#arrive"))$("#arrive").onclick=()=>arrive(o.id);if($("#cancelOrder"))$("#cancelOrder").onclick=()=>cancelOrder(o.id)}
    async function arrive(id){const b=$("#arrive");b.disabled=true;try{const r=await api("arrive",{order_id:id,parking_spot:$("#spot").value});data.active_order=r.order;renderOrder(r.order);navigator.vibrate?.([80,40,120])}catch(e){$("#stateMsg").textContent=message(e.message);b.disabled=false}}
    async function cancelOrder(id){if(!confirm("هل تريد إلغاء الطلب؟"))return;try{const r=await api("cancel",{order_id:id});data.active_order=r.order;stopPolling();renderOrder(r.order)}catch(e){toast(message(e.message),true)}}
    function startPolling(id){stopPolling();pollTimer=setInterval(async()=>{try{const r=await api("state",{order_id:id});const changed=r.order?.updated_at!==data.active_order?.updated_at;data.active_order=r.order;if(changed){renderOrder(r.order);navigator.vibrate?.(35)}if(!["pending","accepted","preparing","ready"].includes(r.order.status))stopPolling()}catch(e){if(e.message==="LOGIN_REQUIRED"){localStorage.removeItem(sessionKey);session="";stopPolling();load()}}},5000)}
    function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
    document.addEventListener("focusin",event=>{if(["plateLetters","plateNumbers"].includes(event.target?.id))event.target.removeAttribute("maxlength")});
    $("#productModal").onclick=e=>{if(e.target===$("#productModal"))show("#productModal",false)};$("#cartModal").onclick=e=>{if(e.target===$("#cartModal"))show("#cartModal",false)};
    load();
  </script>
