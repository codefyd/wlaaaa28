<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#241812">
  <title>اطلب من سيارتك</title>
  <style>
    @font-face{font-family:Foda;src:url("./foda.ttf") format("truetype");font-display:swap}
    :root{--primary:#6f4e37;--secondary:#c8a97e;--bg:#f5f1ec;--btn:#6f4e37;--ink:#241812;--pageInk:#241812;--muted:#746b65;--card:#fff;--line:#e7ddd3;--ok:#16835e;--danger:#b63838}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Foda,Tajawal,system-ui,sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit}.shell{max-width:760px;margin:auto;padding:18px 16px 110px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--pageInk)}.logo{width:52px;height:52px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-size:26px}.logo img{width:100%;height:100%;object-fit:cover}.title{flex:1}.title h1{font-size:22px;margin:0}.title p{margin:3px 0 0;opacity:.72;font-size:14px}.link{color:var(--secondary);font-weight:800;text-decoration:none}
    .card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 12px 38px #2b1a100d;margin-bottom:14px}.hero{background:linear-gradient(140deg,var(--primary),color-mix(in srgb,var(--primary) 58%,#15100c));color:#fff;border:0}.hero p{opacity:.82}.hero h2{font-size:27px;margin:4px 0}.btn{border:0;border-radius:16px;padding:13px 17px;background:var(--btn);color:#fff;font-weight:900;cursor:pointer;min-height:48px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:color-mix(in srgb,var(--primary) 11%,var(--card));color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 25%,var(--line))}.btn.danger{background:#fff1f1;color:var(--danger);border:1px solid #efc5c5}.wide{width:100%}
    .field{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}label{display:block;font-weight:800;margin:13px 2px 7px}.hint,.muted{color:var(--muted);font-size:14px}.otp{font-size:27px;letter-spacing:.45em;text-align:center;direction:ltr}
    .cats{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:4}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:99px;font-weight:800;cursor:pointer}.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}.section-title{font-size:20px;margin:22px 2px 10px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.product{padding:0;overflow:hidden;display:flex;flex-direction:column}.product-img{height:120px;background:color-mix(in srgb,var(--secondary) 18%,#f3ede7);display:grid;place-items:center;font-size:42px}.product-img img{width:100%;height:100%;object-fit:cover}.product-body{padding:13px;display:flex;flex:1;flex-direction:column}.product h3{font-size:16px;margin:0 0 4px}.product p{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.45}.price{font-weight:900;margin-top:auto}.add{width:38px;height:38px;border:0;border-radius:13px;background:var(--btn);color:#fff;font-size:22px;cursor:pointer}.product-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
    .cartbar{position:fixed;z-index:20;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(728px,calc(100% - 24px));background:var(--primary);color:#fff;border:0;border-radius:20px;padding:15px 18px;display:none;align-items:center;justify-content:space-between;box-shadow:0 14px 44px #28180f55;font-weight:900;cursor:pointer}.cartbar.show{display:flex}.badge{background:#fff;color:var(--primary);width:30px;height:30px;border-radius:99px;display:grid;place-items:center}
    .overlay{position:fixed;inset:0;background:#1e130da8;z-index:30;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:var(--bg);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}.sheet-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-18px;background:var(--bg);padding:12px 0;z-index:2}.close{border:0;background:var(--card);width:42px;height:42px;border-radius:14px;font-size:22px}.option{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--card)}.option span{flex:1}.cartline{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.cartline>div:first-child{flex:1}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:11px}.summary{background:color-mix(in srgb,var(--primary) 7%,var(--card));border-radius:16px;padding:13px;margin:14px 0}.sumrow{display:flex;justify-content:space-between;margin:7px 0}.sumrow.total{font-size:20px;font-weight:900;border-top:1px solid var(--line);padding-top:10px}
    .status{display:flex;justify-content:space-between;gap:4px;margin:20px 0}.step{flex:1;text-align:center;font-size:11px;color:var(--muted);position:relative}.step:before{content:"";display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 7px;background:var(--line);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}.step.done:before,.step.now:before{background:var(--ok);box-shadow:0 0 0 1px var(--ok)}.step.now{color:var(--ok);font-weight:900}.plate{font-family:system-ui,sans-serif;letter-spacing:.16em;font-size:29px;font-weight:900;background:#fff;color:#111;border:3px solid #222;border-radius:10px;padding:9px 15px;text-align:center;direction:ltr}.order-items{margin:12px 0}.order-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}.arrival{background:#edf9f4;border:1px solid #bde8d6;padding:14px;border-radius:17px;color:#0b6a49;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.empty{text-align:center;padding:30px;color:var(--muted)}
    @media(max-width:460px){.products{grid-template-columns:1fr}.product{flex-direction:row}.product-img{width:112px;height:auto;min-height:130px;flex:none}.product-body{padding:12px}.shell{padding-inline:12px}.status{gap:0}.step{font-size:10px}}
  </style>
</head>
<body>
  <main class="shell" id="app"><div class="card empty">جاري تحميل قائمة الطلب…</div></main>
  <button class="cartbar" id="cartBar"><span class="badge" id="cartCount">0</span><span>مراجعة الطلب</span><span id="cartTotal">0 ر.س</span></button>
  <div class="overlay" id="productModal"><div class="sheet" id="productSheet"></div></div>
  <div class="overlay" id="cartModal"><div class="sheet" id="cartSheet"></div></div>
  <script type="module">
    import { callFn, applyTheme, escapeHTML, safeHttpUrl, toast } from "./app.js";
    const $=s=>document.querySelector(s);
    const raw=decodeURIComponent(location.hash.slice(1)).trim();
    const code=/^[A-HJ-NP-Z2-9]{8}$/i.test(raw)?raw.toUpperCase():new URLSearchParams(raw).get("c")?.toUpperCase();
    const sessionKey=`customer-session:${code||"invalid"}`;
    let session=localStorage.getItem(sessionKey)||"", data=null, cart=new Map(), selectedCategory="all", pollTimer=null;
    const money=n=>`${Number(n||0).toFixed(2).replace(/\.00$/,"")} ر.س`;
    const api=(action,extra={})=>callFn("order-api",{action,customer_code:code,customer_session:session,...extra});
    const logo=c=>safeHttpUrl(c?.logo_url)?`<img src="${escapeHTML(safeHttpUrl(c.logo_url))}" alt="">`:"☕";
    function theme(c){applyTheme(c);document.documentElement.style.setProperty("--pageInk",contrastText(c.color_background||"#f5f1ec")?"#f8f4f0":"#241812");document.querySelector('meta[name="theme-color"]').content=c.color_primary||"#241812"}
    function contrastText(hex){const c=(hex||"").replace("#","");if(c.length!==6)return false;const n=parseInt(c,16),l=.2126*((n>>16)&255)+.7152*((n>>8)&255)+.0722*(n&255);return l<120}
    function header(c,sub="اطلب من سيارتك") {return `<header class="top"><div class="logo">${logo(c)}</div><div class="title"><h1>${escapeHTML(c.name||"الكافيه")}</h1><p>${escapeHTML(sub)}</p></div><a class="link" href="./index.html#${code}">بطاقتي</a></header>`}
    async function load(){
      if(!code){$("#app").innerHTML='<div class="card empty">الرابط غير صالح.</div>';return}
      try{data=await api("bootstrap");theme(data.cafe||{});render()}
      catch(e){$("#app").innerHTML=`<div class="card empty">تعذر تحميل الطلب.<br><small>${escapeHTML(e.message)}</small></div>`}
    }
    function render(){
      if(!data.cafe?.car_ordering_enabled){$("#app").innerHTML=header(data.cafe)+`<div class="card empty">الطلب من السيارة غير متاح حاليًا.</div>`;return}
      if(!data.authenticated){renderLogin();return}
      if(data.active_order){renderOrder(data.active_order);startPolling(data.active_order.id);return}
      stopPolling();renderMenu();
    }
    function renderLogin(){
      $("#app").innerHTML=header(data.cafe,"دخول آمن للطلب")+`<section class="card hero"><p>طلب أسرع، ومكافآتك معك</p><h2>ادخل برمز واتساب</h2><p>سنرسل رمزًا من 6 أرقام إلى رقمك المسجل. لن نرسل رسائل تسويقية.</p></section><section class="card" id="loginBox"><h2>تأكيد رقمك</h2><p class="muted">اضغط الزر ليصلك الرمز عبر واتساب.</p><button class="btn wide" id="sendOtp">إرسال رمز واتساب</button><p class="hint" id="loginMsg" aria-live="polite"></p></section>`;
      $("#sendOtp").onclick=requestOtp;
    }
    async function requestOtp(){const b=$("#sendOtp"),m=$("#loginMsg");b.disabled=true;m.textContent="جارٍ إرسال الرمز…";try{const r=await callFn("customer-auth",{action:"request",customer_code:code});m.textContent=`أرسلنا الرمز إلى ${r.masked_phone}`;$("#loginBox").innerHTML=`<h2>أدخل رمز التحقق</h2><p class="muted">أرسلناه إلى ${escapeHTML(r.masked_phone)}</p><input class="field otp" id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="btn wide" id="verifyOtp">دخول</button><button class="btn alt wide" style="margin-top:8px" id="resendOtp">إرسال رمز جديد</button><p class="hint" id="loginMsg"></p>`;$("#verifyOtp").onclick=()=>verifyOtp(r.challenge_id);$("#resendOtp").onclick=requestOtp;$("#otp").focus()}catch(e){m.textContent=message(e.message);b.disabled=false}}
    async function verifyOtp(challenge){const v=$("#otp").value.replace(/\D/g,""),m=$("#loginMsg"),b=$("#verifyOtp");if(v.length!==6){m.textContent="أدخل 6 أرقام.";return}b.disabled=true;m.textContent="جارٍ التحقق…";try{const r=await callFn("customer-auth",{action:"verify",customer_code:code,challenge_id:challenge,code:v});session=r.customer_session;localStorage.setItem(sessionKey,session);await load();toast("تم تسجيل الدخول") }catch(e){m.textContent=message(e.message);b.disabled=false}}
    function message(code){return ({WHATSAPP_NOT_CONFIGURED:"خدمة واتساب تحتاج إكمال الإعداد من التاجر.",WHATSAPP_SEND_FAILED:"تعذر إرسال الرسالة الآن. حاول بعد قليل.",WAIT_BEFORE_RESEND:"انتظر دقيقة قبل إعادة الإرسال.",TOO_MANY_REQUESTS:"تم تجاوز عدد المحاولات. حاول لاحقًا.",OTP_INVALID:"الرمز غير صحيح.",OTP_EXPIRED:"انتهت صلاحية الرمز. اطلب رمزًا جديدًا.",OTP_LOCKED:"محاولات كثيرة. اطلب رمزًا جديدًا لاحقًا.",LOGIN_REQUIRED:"يرجى تسجيل الدخول أولًا.",ACTIVE_ORDER_EXISTS:"لديك طلب قائم بالفعل.",MIN_TOTAL_NOT_MET:"قيمة الطلب أقل من الحد الأدنى.",PRODUCT_UNAVAILABLE:"أحد المنتجات لم يعد متاحًا."})[code]||"تعذر إكمال العملية. حاول مرة أخرى."}
    function renderMenu(){
      const cats=data.categories||[],products=data.products||[];
      const filtered=selectedCategory==="all"?products:products.filter(p=>p.category_id===selectedCategory);
      $("#app").innerHTML=header(data.cafe)+`<section class="card hero"><p>استلم طلبك من السيارة</p><h2>اختر طلبك، وبلّغنا عند وصولك</h2><p>الدفع عند الاستلام • مكافأة ولاء واحدة لكل طلب مدفوع</p></section><nav class="cats"><button class="chip ${selectedCategory==="all"?"active":""}" data-cat="all">الكل</button>${cats.map(c=>`<button class="chip ${selectedCategory===c.id?"active":""}" data-cat="${c.id}">${escapeHTML(c.name)}</button>`).join("")}</nav><section class="products">${filtered.map(productCard).join("")||'<div class="card empty" style="grid-column:1/-1">لا توجد منتجات متاحة حاليًا.</div>'}</section>`;
      document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.cat;renderMenu()});
      document.querySelectorAll("[data-product]").forEach(b=>b.onclick=()=>openProduct(b.dataset.product));updateCartBar();
    }
    function productCard(p){const img=safeHttpUrl(p.image_url);return `<article class="card product"><div class="product-img">${img?`<img src="${escapeHTML(img)}" alt="">`:"☕"}</div><div class="product-body"><h3>${escapeHTML(p.name)}</h3><p>${escapeHTML(p.description||"")}</p><div class="product-foot"><span class="price">${money(p.base_price)}</span><button class="add" data-product="${p.id}" aria-label="إضافة ${escapeHTML(p.name)}">＋</button></div></div></article>`}
    function openProduct(id){const p=data.products.find(x=>x.id===id),opts=data.options.filter(o=>o.product_id===id);$("#productSheet").innerHTML=`<div class="sheet-head"><h2>${escapeHTML(p.name)}</h2><button class="close" data-close>×</button></div><p class="muted">${escapeHTML(p.description||"")}</p>${[...new Set(opts.map(o=>o.group_name))].map(group=>`<h3>${escapeHTML(group)}</h3>${opts.filter(o=>o.group_name===group).map(o=>`<label class="option"><input type="${o.is_multiple?"checkbox":"radio"}" name="group-${escapeHTML(group)}" value="${o.id}"><span>${escapeHTML(o.name)}</span><b>${o.price_delta?`+ ${money(o.price_delta)}`:"مجانًا"}</b></label>`).join("")}`).join("")}<button class="btn wide" id="addProduct">إضافة للطلب • ${money(p.base_price)}</button>`;show("#productModal",true);$("#productSheet [data-close]").onclick=()=>show("#productModal",false);$("#addProduct").onclick=()=>{const optionIds=[...$("#productSheet").querySelectorAll("input:checked")].map(i=>i.value).sort(),key=`${id}:${optionIds.join(",")}`,old=cart.get(key);cart.set(key,{key,product:p,optionIds,quantity:(old?.quantity||0)+1});show("#productModal",false);updateCartBar();toast("تمت الإضافة")}}
    function show(sel,on){$(sel).classList.toggle("show",on)}
    function totals(){let subtotal=0;for(const line of cart.values()){const extras=line.optionIds.reduce((s,id)=>s+Number(data.options.find(o=>o.id===id)?.price_delta||0),0);subtotal+=(Number(line.product.base_price)+extras)*line.quantity}return subtotal}
    function updateCartBar(){const count=[...cart.values()].reduce((s,l)=>s+l.quantity,0);$("#cartCount").textContent=count;$("#cartTotal").textContent=money(totals());$("#cartBar").classList.toggle("show",count>0)}
    $("#cartBar").onclick=openCart;
    function openCart(){if(!cart.size)return;renderCartSheet();show("#cartModal",true)}
    function renderCartSheet(){const rewards=data.rewards||[],lines=[...cart.values()];$("#cartSheet").innerHTML=`<div class="sheet-head"><h2>مراجعة الطلب</h2><button class="close" data-close>×</button></div><div>${lines.map(l=>{const opts=l.optionIds.map(id=>data.options.find(o=>o.id===id)?.name).filter(Boolean);return `<div class="cartline"><div><b>${escapeHTML(l.product.name)}</b><div class="hint">${escapeHTML(opts.join("، "))}</div></div><div class="qty"><button data-minus="${escapeHTML(l.key)}">−</button><b>${l.quantity}</b><button data-plus="${escapeHTML(l.key)}">＋</button></div></div>`}).join("")}</div>${rewards.length?`<label>استخدام مكافأة مجانية</label><select class="field" id="reward"><option value="">بدون مكافأة</option>${rewards.map(r=>`<option value="${r.id}">${escapeHTML(r.label)}</option>`).join("")}</select><label>المنتج المجاني</label><select class="field" id="rewardProduct" disabled><option value="">اختر المنتج</option>${lines.map(l=>`<option value="${l.product.id}">${escapeHTML(l.product.name)}</option>`).join("")}</select><p class="hint">تغطي المكافأة سعر منتج واحد الأساسي فقط، وتبقى الإضافات مدفوعة.</p>`:""}<label>رقم اللوحة *</label><input class="field" id="plate" maxlength="30" placeholder="مثال: أ ب ج 1234"><label>لون السيارة *</label><input class="field" id="color" maxlength="40" placeholder="مثال: أبيض"><label>نوع / موديل السيارة</label><input class="field" id="model" maxlength="80" placeholder="مثال: كامري"><label>ملاحظة</label><textarea class="field" id="note" maxlength="500" rows="2" placeholder="بدون بصل، مدخل جانبي…"></textarea><div class="summary"><div class="sumrow total"><span>المجموع المبدئي</span><span>${money(totals())}</span></div><div class="hint">السعر النهائي والمكافأة يؤكدهما النظام عند الإرسال.</div></div><button class="btn wide" id="submitOrder">تأكيد الطلب • الدفع عند الاستلام</button><p class="hint" id="orderMsg"></p>`;
      $("#cartSheet [data-close]").onclick=()=>show("#cartModal",false);document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>changeQty(b.dataset.plus,1));document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>changeQty(b.dataset.minus,-1));const reward=$("#reward");if(reward)reward.onchange=()=>$("#rewardProduct").disabled=!reward.value;$("#submitOrder").onclick=submitOrder;
    }
    function changeQty(key,delta){const l=cart.get(key);if(!l)return;l.quantity+=delta;if(l.quantity<1)cart.delete(key);updateCartBar();if(cart.size)renderCartSheet();else show("#cartModal",false)}
    async function submitOrder(){const b=$("#submitOrder"),m=$("#orderMsg"),plate=$("#plate").value.trim(),color=$("#color").value.trim(),reward=$("#reward")?.value||"",rewardProduct=$("#rewardProduct")?.value||"";if(plate.length<2||color.length<2){m.textContent="أدخل رقم اللوحة ولون السيارة.";return}if(reward&&!rewardProduct){m.textContent="اختر المنتج الذي ستطبق عليه المكافأة.";return}b.disabled=true;m.textContent="جارٍ إرسال الطلب…";try{const r=await api("create",{vehicle_plate:plate,vehicle_color:color,vehicle_model:$("#model").value,note:$("#note").value,reward_id:reward||null,reward_product_id:rewardProduct||null,items:[...cart.values()].map(l=>({product_id:l.product.id,quantity:l.quantity,option_ids:l.optionIds}))});data.active_order=r.order;cart.clear();updateCartBar();show("#cartModal",false);renderOrder(r.order);startPolling(r.order.id);navigator.vibrate?.([40,30,80]);toast("تم إرسال طلبك") }catch(e){m.textContent=message(e.message);b.disabled=false}}
    const statusLabels={pending:"بانتظار القبول",accepted:"تم قبول الطلب",preparing:"قيد التحضير",ready:"جاهز للاستلام",completed:"تم التسليم",cancelled:"ملغي",no_show:"لم يحضر"};
    function renderOrder(o){const stages=["pending","accepted","preparing","ready"],idx=stages.indexOf(o.status),active=stages.includes(o.status);$("#app").innerHTML=header(data.cafe,"متابعة الطلب")+`<section class="card hero"><p>طلب رقم #${o.order_number}</p><h2>${escapeHTML(statusLabels[o.status]||o.status)}</h2><div class="plate">${escapeHTML(o.vehicle_plate)}</div></section><section class="card"><div class="status">${stages.map((s,i)=>`<div class="step ${i<idx?"done":i===idx?"now":""}">${statusLabels[s]}</div>`).join("")}</div>${o.arrived_at?'<div class="arrival">✓ تم إبلاغ الكاشير بوصولك</div>':active?`<label>رقم الموقف أو وصف مكانك</label><input class="field" id="spot" maxlength="50" placeholder="مثال: موقف 4 أمام الباب"><button class="btn wide" style="margin-top:9px" id="arrive">أنا وصلت للمحل</button>`:""}<div class="order-items">${(o.order_items||[]).map(i=>`<div class="order-row"><span>${i.quantity} × ${escapeHTML(i.product_name)}${i.reward_applied?' 🎁':''}</span><b>${money(i.line_total)}</b></div>`).join("")}</div><div class="summary"><div class="sumrow"><span>المجموع</span><span>${money(o.subtotal)}</span></div>${Number(o.discount_total)>0?`<div class="sumrow"><span>المكافأة</span><span>− ${money(o.discount_total)}</span></div>`:""}<div class="sumrow total"><span>المطلوب عند الاستلام</span><span>${money(o.total)}</span></div></div>${o.status==="pending"?'<button class="btn danger wide" id="cancelOrder">إلغاء الطلب</button>':""}${!active?`<a class="btn alt wide" style="display:block;text-align:center;text-decoration:none;margin-top:9px" href="./order.html#${code}">طلب جديد</a>`:""}<p class="hint" id="stateMsg"></p></section>`;$("#cartBar").classList.remove("show");if($("#arrive"))$("#arrive").onclick=()=>arrive(o.id);if($("#cancelOrder"))$("#cancelOrder").onclick=()=>cancelOrder(o.id)}
    async function arrive(id){const b=$("#arrive");b.disabled=true;try{const r=await api("arrive",{order_id:id,parking_spot:$("#spot").value});data.active_order=r.order;renderOrder(r.order);navigator.vibrate?.([80,40,120]);toast("تم إبلاغ الكاشير بوصولك") }catch(e){toast(message(e.message),true);b.disabled=false}}
    async function cancelOrder(id){if(!confirm("هل تريد إلغاء الطلب؟"))return;try{const r=await api("cancel",{order_id:id});data.active_order=r.order;stopPolling();renderOrder(r.order)}catch(e){toast(message(e.message),true)}}
    function startPolling(id){stopPolling();pollTimer=setInterval(async()=>{try{const r=await api("state",{order_id:id});const changed=r.order?.updated_at!==data.active_order?.updated_at;data.active_order=r.order;if(changed){renderOrder(r.order);navigator.vibrate?.(35)}if(!["pending","accepted","preparing","ready"].includes(r.order.status))stopPolling()}catch(e){if(e.message==="LOGIN_REQUIRED"){localStorage.removeItem(sessionKey);session="";stopPolling();load()}}},5000)}
    function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
    $("#productModal").onclick=e=>{if(e.target===$("#productModal"))show("#productModal",false)};$("#cartModal").onclick=e=>{if(e.target===$("#cartModal"))show("#cartModal",false)};
    load();
  </script>
</body>
</html>
